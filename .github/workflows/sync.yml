name: Sync NIOS study material

# Manual only. Crawls the NIOS OBE page, re-processes new/changed PDFs (embeds Kruti Dev, shrinks images),
# uploads 10 MB+ files as release assets, regenerates the README and commits.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would change (no downloads, no commit, no release)"
        type: boolean
        default: false
      force:
        description: "Re-process every PDF even if NIOS says it is unchanged (long: ~15-30 min)"
        type: boolean
        default: false
      only:
        description: "Optional: only process PDFs whose URL contains this text (e.g. Level_C)"
        type: string
        default: ""
      release_tag:
        description: "Release that holds the large files"
        type: string
        default: "large-files-v1"

permissions:
  contents: write

concurrency:
  group: sync-nios
  cancel-in-progress: false

env:
  TAG: ${{ inputs.release_tag }}
  ONLY: ${{ inputs.only }}
  FORCE: ${{ inputs.force }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pymupdf curl_cffi

      - name: Dry run (list changes only)
        if: ${{ inputs.dry_run }}
        run: python tools/sync.py --repo . --work "$RUNNER_TEMP/work" --dry-run --tag "$TAG" --only "$ONLY"

      - name: Sync (crawl, process, regenerate README)
        if: ${{ !inputs.dry_run }}
        run: |
          args=(--repo . --work "$RUNNER_TEMP/work" --tag "$TAG" --only "$ONLY")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python tools/sync.py "${args[@]}"

      - name: Upload large files to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="$RUNNER_TEMP/work/release_stage"
          [ -d "$stage" ] && [ -n "$(ls -A "$stage")" ] || { echo "no release assets changed"; exit 0; }
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Large files (10 MB+)" \
              --notes "NIOS OBE PDFs of 10 MB or more. See the README for the index, sources and copyright notice."
          gh release upload "$TAG" "$stage"/* --clobber

      - name: Commit and push changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Sync NIOS study material ($(date -u +%Y-%m-%d))"
          git push
